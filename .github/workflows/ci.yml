name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, migrate, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_whiteboard_v2
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_whiteboard_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/agentic_whiteboard_v2

    steps:
      - uses: actions/checkout@v4.4.0

      - uses: pnpm/action-setup@v4.3.0
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply the baseline migration
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end document flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_whiteboard_v2
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_whiteboard_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/agentic_whiteboard_v2
      DOC_SERVICE_SECRET: development-only-document-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4.4.0

      - uses: pnpm/action-setup@v4.3.0
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @v2/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
