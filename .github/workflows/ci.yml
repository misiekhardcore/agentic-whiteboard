name: CI
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.3.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: probe
          path: .
      - run: echo ok
