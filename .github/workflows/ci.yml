name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Secrets are not available to a job-level `if`, so this preflight reports
  # whether the Stripe checkout spec can run. The rest of the E2E suite always
  # runs; the billing spec skips its checkout test when the keys are absent.
  stripe-secrets:
    name: Check Stripe test secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stripe checkout E2E will be skipped: add STRIPE_SECRET_KEY (sk_test_…) and STRIPE_PUBLISHABLE_KEY (pk_test_…) repository secrets. The account and dashboard E2E tests still run."
          fi

  e2e:
    name: E2E
    needs: stripe-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_whiteboard
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/agentic_whiteboard
      BETTER_AUTH_SECRET: e2e-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2500"
      SMTP_FROM: Agentic Whiteboard <no-reply@localhost>
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the database
        run: pnpm db:migrate

      - name: Install the Stripe CLI
        if: needs.stripe-secrets.outputs.available == 'true'
        run: |
          curl -fsSL https://github.com/stripe/stripe-cli/releases/download/v1.55.9/stripe_1.55.9_linux_x86_64.tar.gz -o /tmp/stripe.tar.gz
          tar -xzf /tmp/stripe.tar.gz -C /tmp stripe
          sudo install /tmp/stripe /usr/local/bin/stripe
          stripe --version

      - name: Forward Stripe events to the app
        if: needs.stripe-secrets.outputs.available == 'true'
        run: |
          stripe listen \
            --api-key "$STRIPE_SECRET_KEY" \
            --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted \
            --forward-to localhost:3000/api/billing/webhook \
            > /tmp/stripe-listen.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q "Your webhook signing secret is" /tmp/stripe-listen.log; then
              break
            fi
            sleep 1
          done
          SECRET=$(grep -o 'whsec_[A-Za-z0-9]*' /tmp/stripe-listen.log | head -1)
          if [ -z "$SECRET" ]; then
            echo "stripe listen did not start:"
            cat /tmp/stripe-listen.log
            exit 1
          fi
          echo "STRIPE_WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "Forwarding Stripe test events to /api/billing/webhook"

      - name: Start the mail sink
        run: pnpm test:e2e:smtp > /tmp/smtp-sink.log 2>&1 &

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the app
        env:
          PORT: "3000"
        run: |
          pnpm start > /tmp/app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          echo "The app did not start:"
          cat /tmp/app.log
          exit 1

      - name: Run the end-to-end tests
        env:
          E2E_SKIP_WEB_SERVER: "1"
        run: pnpm test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
